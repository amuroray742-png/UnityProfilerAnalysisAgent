name: macOS validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal
      - name: Frontend regression and build
        run: |
          npm test
          npm run build
      - name: Rust and public protocol regression
        run: cargo +stable test --manifest-path src-tauri/Cargo.toml --locked
      - name: Research decoder regression
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: macOS application and disk image
        run: npm run tauri:build -- --bundles app,dmg
      - name: Bundled stdio bridge regression
        env:
          UPAA_TEST_APP_EXE: ${{ github.workspace }}/src-tauri/target/release/bundle/macos/Unity Profiler Analysis Agent.app/Contents/MacOS/unity-profiler-analysis-agent
        run: cargo +stable test --manifest-path src-tauri/Cargo.toml --locked --test mcp_wire --test acp_stdio_roundtrip --test reports_source --test optimization
      - uses: actions/upload-artifact@v7
        with:
          name: macos-unsigned-validation-${{ matrix.architecture }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
